openapi: 3.0.3
info:
  title: API управления домами и обращениями
  description: |
    REST API для взаимодействия жильцов и сотрудников управляющих компаний (УК)
    с домами, квартирами, обращениями, опросами, уведомлениями и капремонтом.

    Привязка и отвязка жильца к квартире — по одноразовым кодам доступа,
    которые генерирует УК.
  version: 1.3.0
servers:
  - url: http://127.0.0.1:8000
    description: Dev

tags:
  - name: Auth
  - name: User
  - name: UK
  - name: Polls
  - name: Notifications
  - name: CapitalRepair

security:
  - cookieAuth: []

paths:

  # ---------- AUTH ----------

  /api/v1/login:
    post:
      tags: [Auth]
      summary: Вход или регистрация (юзер или сотрудник УК)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LoginUserRequest'
                - $ref: '#/components/schemas/LoginUKRequest'
      responses:
        '200':
          description: Успех (или пользователь уже существует)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginUserResponse'
                  - $ref: '#/components/schemas/LoginUKResponse'
                  - $ref: '#/components/schemas/LoginExistingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ---------- USER: PROFILE ----------

  /api/v1/me:
    get:
      tags: [User]
      summary: Профиль текущего пользователя + квартиры
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------- PUBLIC: DOMIKS SEARCH ----------

  /api/v1/domiks:
    get:
      tags: [User]
      summary: Поиск домов по адресу
      description: |
        Поиск домов по подстроке адреса (регистронезависимо).
        Минимум 2 символа в `search`, иначе вернётся пустой список.
        `limit` ограничен диапазоном 1–50.
      parameters:
        - name: search
          in: query
          description: Подстрока адреса
          schema: { type: string, minLength: 2 }
        - name: limit
          in: query
          description: Максимум результатов
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  domiks:
                    type: array
                    items: { $ref: '#/components/schemas/DomikSearchItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------- USER: APARTMENTS ----------

  /api/v1/user/apartments:
    get:
      tags: [User]
      summary: Список квартир текущего пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  apartments:
                    type: array
                    items: { $ref: '#/components/schemas/UserApartment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    post:
      tags: [User]
      summary: Привязать квартиру по коду (bind)
      description: |
        Код генерирует УК через `POST /uk/domiks/<id>/apartments/<apartment_id>/generate-key`
        с `purpose=bind` и передаёт жильцу. После успешной привязки код удаляется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domik_id, number, code]
              properties:
                domik_id: { type: string, format: uuid }
                number: { type: string }
                code: { type: string, minLength: 10, maxLength: 10 }
      responses:
        '201':
          description: Квартира добавлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserApartmentCreateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Неверный bind-код или код не сгенерирован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '404':
          description: Квартира не найдена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409':
          description: Квартира уже добавлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }

  /api/v1/user/apartments/{apartment_id}/delete:
    delete:
      tags: [User]
      summary: Отвязать квартиру по коду (unbind)
      description: |
        Код генерирует УК через `POST /uk/domiks/<id>/apartments/<apartment_id>/generate-key`
        с `purpose=unbind`. После успешной отвязки код удаляется.
        Если отвязывается основная квартира и есть другие — одна из них становится основной.
      parameters:
        - { name: apartment_id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: code
          in: query
          required: true
          description: 10-значный код отвязки
          schema: { type: string, minLength: 10, maxLength: 10 }
      responses:
        '200':
          description: Квартира отвязана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400':
          description: Не передан код
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Неверный unbind-код или код не сгенерирован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '404':
          description: Квартира не найдена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }

  # ---------- USER: APPEALS ----------

  /api/v1/user/appeals:
    get:
      tags: [User]
      summary: Список обращений текущего пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  appeals:
                    type: array
                    items: { $ref: '#/components/schemas/AppealListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [User]
      summary: Создать обращение
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apartment_id, title, description]
              properties:
                apartment_id: { type: string, format: uuid }
                title: { type: string, maxLength: 200 }
                description: { type: string }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppealCreateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/v1/user/appeals/{id}:
    get:
      tags: [User]
      summary: Детали обращения + история
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppealDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  # ---------- USER: POLLS ----------

  /api/v1/user/polls:
    get:
      tags: [Polls]
      summary: Опросы по домам пользователя
      parameters:
        - { name: domik_id, in: query, schema: { type: string, format: uuid } }
        - { name: active, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  polls:
                    type: array
                    items: { $ref: '#/components/schemas/Poll' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/v1/user/polls/{id}:
    get:
      tags: [Polls]
      summary: Детали опроса
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/user/polls/{id}/vote:
    post:
      tags: [Polls]
      summary: Проголосовать или сменить голос
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice_id]
              properties:
                choice_id: { type: string, format: uuid }
      responses:
        '200':
          description: Голос обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteResponse' }
        '201':
          description: Голос создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: УК не голосует
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/v1/user/polls/{id}/results:
    get:
      tags: [Polls]
      summary: Результаты опроса
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollResults' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------- USER: NOTIFICATIONS ----------

  /api/v1/user/notifications:
    get:
      tags: [Notifications]
      summary: Уведомления по домам пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/UserNotificationListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/user/notifications/{id}:
    get:
      tags: [Notifications]
      summary: Детали уведомления (юзер)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserNotificationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------- USER: CAPITAL REPAIR ----------

  /api/v1/user/domik/{domik_id}/capital-repair:
    get:
      tags: [CapitalRepair]
      summary: Капремонт по дому (для жильца)
      parameters:
        - { name: domik_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapitalRepairEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Нет доступа к этому дому
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }

  # ---------- UK: DOMIKS ----------

  /api/v1/uk/domiks:
    get:
      tags: [UK]
      summary: Список домов УК
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  domiks:
                    type: array
                    items: { $ref: '#/components/schemas/DomikListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    post:
      tags: [UK]
      summary: Создать дом + квартиры
      description: |
        Создаёт дом и квартиры. `apartments` может быть либо объектом
        (один диапазон), либо массивом объектов (несколько диапазонов — например,
        по подъездам). Номера квартир не должны повторяться между диапазонами.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, apartments]
              properties:
                address: { type: string }
                fias_id: { type: string }
                apartments:
                  oneOf:
                    - $ref: '#/components/schemas/ApartmentsRange'
                    - type: array
                      minItems: 1
                      items: { $ref: '#/components/schemas/ApartmentsRange' }
      responses:
        '201':
          description: Дом создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomikCreateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/uk/domiks/{id}:
    get:
      tags: [UK]
      summary: Детали дома + квартиры
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomikDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [UK]
      summary: Удалить дом (каскадно)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  # ---------- UK: APARTMENTS ----------

  /api/v1/uk/domiks/{id}/apartments:
    get:
      tags: [UK]
      summary: Список квартир дома
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  domik_id: { type: string, format: uuid }
                  address: { type: string }
                  apartments:
                    type: array
                    items: { $ref: '#/components/schemas/ApartmentShort' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [UK]
      summary: Создать квартиру в доме
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties:
                number: { type: string }
                entrance: { type: string }
      responses:
        '201':
          description: Квартира создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApartmentShort' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/uk/domiks/{id}/apartments/{apartment_id}:
    get:
      tags: [UK]
      summary: Детали квартиры + жильцы
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: apartment_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApartmentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [UK]
      summary: Изменить квартиру
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: apartment_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number: { type: string }
                entrance: { type: string }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApartmentUpdateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [UK]
      summary: Удалить квартиру
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: apartment_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/uk/domiks/{id}/apartments/{apartment_id}/generate-key:
    post:
      tags: [UK]
      summary: Сгенерировать код доступа к квартире (bind / unbind)
      description: |
        Генерирует 10-значный цифровой код. `purpose=bind` — для привязки
        (используется в `POST /user/apartments`), `purpose=unbind` — для отвязки
        (используется в `DELETE /user/apartments/{apartment_id}/delete`).
        Код одноразовый — удаляется после успешного использования.
        Повторный вызов для того же purpose перезаписывает существующий код.
        На квартиру может быть один bind-код и один unbind-код одновременно.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: apartment_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  enum: [bind, unbind]
                  default: bind
      responses:
        '200':
          description: Код перезаписан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApartmentKeyResponse' }
        '201':
          description: Код создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApartmentKeyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  # ---------- UK: APPEALS ----------

  /api/v1/uk/appeals:
    get:
      tags: [UK]
      summary: Все обращения по домам УК
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [new, in_progress, done, rejected] } }
        - { name: domik_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  appeals:
                    type: array
                    items: { $ref: '#/components/schemas/UKAppealListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/uk/appeals/{id}:
    get:
      tags: [UK]
      summary: Детали обращения + история (УК)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UKAppealDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/v1/uk/appeals/{id}/status:
    post:
      tags: [UK]
      summary: Обновить статус обращения
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [new, in_progress, done, rejected] }
                text: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppealStatusUpdateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
