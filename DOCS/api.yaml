        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    post:
      tags: [UK, Notifications]
      summary: Создать уведомление
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domik_id, title, text]
              properties:
                domik_id: { type: string, format: uuid }
                title: { type: string, maxLength: 200 }
                text: { type: string }
      responses:
        '201':
