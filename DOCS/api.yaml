  # ---------- UK: CAPITAL REPAIR ----------

  /api/v1/uk/domiks/{id}/capital-repair:
    get:
      tags: [UK, CapitalRepair]
      summary: Капремонт дома (УК)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapitalRepairEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [UK, CapitalRepair]
      summary: Создать счёт капремонта
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tariff_per_sqm: { type: string }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  capital_repair: { $ref: '#/components/schemas/CapitalRepair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [UK, CapitalRepair]
      summary: Обновить показатели капремонта
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tariff_per_sqm: { type: string }
                collected_total: { type: string }
                spent_total: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  capital_repair: { $ref: '#/components/schemas/CapitalRepair' }
                  updated_fields:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/v1/uk/domiks/{id}/capital-repair/works:
    get:
      tags: [UK, CapitalRepair]
      summary: Программа работ
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  works:
                    type: array
                    items: { $ref: '#/components/schemas/CapitalRepairWork' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [UK, CapitalRepair]
      summary: Добавить работу
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_type, planned_year]
              properties:
                work_type: { type: string }
                planned_year: { type: integer, minimum: 1900, maximum: 2200 }
                status: { type: string, enum: [planned, in_progress, done] }
                cost: { type: string, nullable: true }
                contractor: { type: string }
                description: { type: string }
                completed_at: { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  work: { $ref: '#/components/schemas/CapitalRepairWork' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/v1/uk/domiks/{id}/capital-repair/works/{work_id}:
    patch:
      tags: [UK, CapitalRepair]
      summary: Изменить работу
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: work_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                work_type: { type: string }
                planned_year: { type: integer }
                status: { type: string, enum: [planned, in_progress, done] }
                cost: { type: string, nullable: true }
                contractor: { type: string }
                description: { type: string }
                completed_at: { type: string, format: date, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  work: { $ref: '#/components/schemas/CapitalRepairWork' }
                  updated_fields:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    delete:
      tags: [UK, CapitalRepair]
      summary: Удалить работу
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: work_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

  responses:
    BadRequest:
      description: Ошибка в данных / некорректный JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Status' }
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Status' }
    Forbidden:
      description: Нет прав
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Status' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Status' }
    MethodNotAllowed:
      description: Метод не разрешён
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Status' }
    Conflict:
      description: Конфликт
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Status' }

  schemas:

    Status:
      type: object
      properties:
        status: { type: string }

    ManagementOrg:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    ManagementOrgWithInn:
      allOf:
        - $ref: '#/components/schemas/ManagementOrg'
        - type: object
          properties:
            inn: { type: string }

    # --------- AUTH ---------

    LoginUserRequest:
      type: object
      required: [max_id, name]
      properties:
        max_id: { type: string }
        name:   { type: string }

    LoginUKRequest:
      type: object
      required: [max_id, name, is_jk, management_org]
      properties:
        max_id: { type: string }
        name:   { type: string }
        is_jk:  { type: boolean, enum: [true] }
        management_org:
          type: object
          required: [name, inn]
          properties:
            name: { type: string }
            inn:  { type: string }

    LoginUserResponse:
      type: object
      properties:
        status: { type: string }
        id: { type: string, format: uuid }
        is_jk: { type: boolean }
        management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrgWithInn' }] }

    LoginUKResponse:
      type: object
      properties:
        status: { type: string }
        id: { type: string, format: uuid }
        is_jk: { type: boolean }
        management_org: { $ref: '#/components/schemas/ManagementOrgWithInn' }

    LoginExistingResponse:
      type: object
      properties:
        status: { type: string, example: "Такой пользователь уже существует" }
        id: { type: string, format: uuid }
        is_jk: { type: boolean }

    # --------- USER PROFILE ---------

    UserApartment:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        entrance: { type: string }
        domik_id: { type: string, format: uuid }
        domik_address: { type: string }
        management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrg' }] }
        role: { type: string, enum: [resident, owner, chair] }
        role_display: { type: string }
        is_primary: { type: boolean }

    MeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        max_id: { type: string }
        name: { type: string }
        last_name: { type: string }
        is_jk: { type: boolean }
        management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrg' }] }
        apartments:
          type: array
          items: { $ref: '#/components/schemas/UserApartment' }

    UserApartmentCreateResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        domik_id: { type: string, format: uuid }
        role: { type: string, enum: [resident, owner, chair] }
        is_primary: { type: boolean }

    # --------- APARTMENT KEY ---------

    ApartmentKeyResponse:
      type: object
      properties:
        status: { type: string }
        apartment_id: { type: string, format: uuid }
        apartment_number: { type: string }
        purpose: { type: string, enum: [bind, unbind] }
        code: { type: string, minLength: 10, maxLength: 10 }
        created_at: { type: string, format: date-time }

    # --------- APPEALS ---------

    AppealListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [new, in_progress, done, rejected] }
        created_at: { type: string, format: date-time }
        apartment_id: { type: string, format: uuid }
        apartment_number: { type: string }
        domik_id: { type: string, format: uuid }
        domik_address: { type: string }
        management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrg' }] }

    AppealCreateResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrg' }] }
        status: { type: string }
        created_at: { type: string, format: date-time }

    AppealDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        status_display: { type: string }
        domik:
          type: object
          properties:
            id: { type: string, format: uuid }
            address: { type: string }
            management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrg' }] }
        apartment:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            number: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        history:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              status_display: { type: string }
              text: { type: string }
              changed_by: { type: string, nullable: true }
              changed_at: { type: string, format: date-time }

    UKAppealListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        status_display: { type: string }
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            last_name: { type: string }
        domik_id: { type: string, format: uuid }
        domik_address: { type: string }
        apartment_number: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UKAppealDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [new, in_progress, done, rejected] }
        status_display: { type: string }
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            max_id: { type: string }
            name: { type: string }
            last_name: { type: string }
        domik:
          type: object
          properties:
            id: { type: string, format: uuid }
            address: { type: string }
            management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrg' }] }
        apartment:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            number: { type: string }
            entrance: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        history:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              status_display: { type: string }
              text: { type: string }
              changed_by:
                nullable: true
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  last_name: { type: string }
              changed_at: { type: string, format: date-time }

    AppealStatusUpdateResponse:
      type: object
      properties:
        status: { type: string }
        appeal_id: { type: string, format: uuid }
        new_status: { type: string }
        status_display: { type: string }

    # --------- POLLS ---------

    PollChoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        order: { type: integer }
        votes_count: { type: integer }
        is_user_choice: { type: boolean }

    Poll:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            last_name: { type: string }
        domik:
          type: object
          properties:
            id: { type: string, format: uuid }
            address: { type: string }
        total_votes: { type: integer }
        choices:
          type: array
          items: { $ref: '#/components/schemas/PollChoice' }
        user_voted: { type: boolean }
        user_choice_id: { type: string, format: uuid, nullable: true }

    PollResults:
      type: object
      properties:
        poll_id: { type: string, format: uuid }
        title: { type: string }
        total_votes: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              text: { type: string }
              votes_count: { type: integer }
              percent: { type: number, format: float }

    VoteResponse:
      type: object
      properties:
        status: { type: string }
        created: { type: boolean }
        poll_id: { type: string, format: uuid }
        choice_id: { type: string, format: uuid }
        total_votes: { type: integer }

    # --------- NOTIFICATIONS ---------

    UserNotificationListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        text: { type: string }
        created_at: { type: string, format: date-time }
        domik:
          type: object
          properties:
            id: { type: string, format: uuid }
            address: { type: string }
        management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrg' }] }

    UserNotificationDetail:
      allOf:
        - $ref: '#/components/schemas/UserNotificationListItem'
        - type: object
          properties:
            created_by:
              nullable: true
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }

    UKNotificationListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        text: { type: string }
        created_at: { type: string, format: date-time }
        domik:
          type: object
          properties:
            id: { type: string, format: uuid }
            address: { type: string }
        created_by:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }

    UKNotificationDetail:
      $ref: '#/components/schemas/UKNotificationListItem'

    UKNotificationCreateResponse:
      type: object
      properties:
        status: { type: string }
        notification:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            text: { type: string }
            created_at: { type: string, format: date-time }
            domik:
              type: object
              properties:
                id: { type: string, format: uuid }
                address: { type: string }

    # --------- DOMIKS & APARTMENTS ---------

    ApartmentsRange:
      type: object
      required: [from, to]
      properties:
        from: { type: integer, minimum: 1, description: Номер первой квартиры в диапазоне }
        to:   { type: integer, description: Номер последней квартиры в диапазоне }
        entrance: { type: string, description: Номер подъезда }

    DomikSearchItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrg' }] }

    DomikListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        fias_id: { type: string }
        management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrg' }] }
        apartments_count: { type: integer }
        appeals_count: { type: integer }
        new_appeals_count: { type: integer }
        created_at: { type: string, format: date-time }

    DomikCreateResponse:
      type: object
      properties:
        status: { type: string }
        domik_id: { type: string, format: uuid }
        address: { type: string }
        management_org: { $ref: '#/components/schemas/ManagementOrg' }
        apartments_created: { type: integer }

    ApartmentShort:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        entrance: { type: string }
        residents_count: { type: integer }

    DomikDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        fias_id: { type: string }
        management_org: { nullable: true, allOf: [{ $ref: '#/components/schemas/ManagementOrg' }] }
        created_at: { type: string, format: date-time }
        apartments:
          type: array
          items: { $ref: '#/components/schemas/ApartmentShort' }

    ApartmentDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        entrance: { type: string }
        domik_id: { type: string, format: uuid }
        domik_address: { type: string }
        residents:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              max_id: { type: string }
              name: { type: string }
              last_name: { type: string }
              role: { type: string }
              role_display: { type: string }
              is_primary: { type: boolean }
        appeals_count: { type: integer }

    ApartmentUpdateResponse:
      type: object
      properties:
        status: { type: string }
        id: { type: string, format: uuid }
        number: { type: string }
        entrance: { type: string }
        updated_fields:
          type: array
          items: { type: string }

    # --------- CAPITAL REPAIR ---------

    CapitalRepair:
      type: object
      properties:
        id: { type: string, format: uuid }
        domik_id: { type: string, format: uuid }
        tariff_per_sqm: { type: string }
        collected_total: { type: string }
        spent_total: { type: string }
        balance: { type: string }
        updated_at: { type: string, format: date-time }

    CapitalRepairWork:
      type: object
      properties:
        id: { type: string, format: uuid }
        work_type: { type: string }
        planned_year: { type: integer }
        status: { type: string, enum: [planned, in_progress, done] }
        status_display: { type: string }
        cost: { type: string, nullable: true }
        contractor: { type: string }
        description: { type: string }
        completed_at: { type: string, format: date, nullable: true }

    CapitalRepairEnvelope:
      type: object
      properties:
        domik:
          type: object
          properties:
            id: { type: string, format: uuid }
            address: { type: string }
        capital_repair:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/CapitalRepair' }]
        works:
          type: array
          items: { $ref: '#/components/schemas/CapitalRepairWork' }
        status: { type: string }