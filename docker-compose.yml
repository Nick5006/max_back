services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: apihandler:latest
    container_name: apihandler-web
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN}"
      MAX_API_BASE_URL: "${MAX_API_BASE_URL}"
      DADATA_TOKEN: "${DADATA_TOKEN}"
      DADATA_SECRET_TOKEN: "${DADATA_SECRET_TOKEN}"
      HOUSESCORE_KEY: "${HOUSESCORE_KEY}"
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: "*"
      DB_PATH: "/app/data/db.sqlite3"
      CORS_ALLOWED_ORIGINS: "https://max-front-pearl.vercel.app,https://forge.etsi.org,https://platform-api2.max.ru"
      CSRF_TRUSTED_ORIGINS: "https://platform-api2.max.ru,https://max-front-pearl.vercel.app,https://*.cloudpub.ru,https://*.trycloudflare.com"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/admin/login/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudpub:
    image: cloudpub/cloudpub:latest
    container_name: apihandler-cloudpub
    command: publish http web:8000
    environment:
      TOKEN: "${CLOUDPUB_TOKEN}"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped