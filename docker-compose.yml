services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: apihandler:latest
    container_name: apihandler-web
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      SECRET_KEY: "change-me-to-a-random-50-char-string"
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: "*"
      DB_PATH: "/app/data/db.sqlite3"
      CORS_ALLOWED_ORIGINS: "https://forge.etsi.org"
      CSRF_TRUSTED_ORIGINS: "https://*.trycloudflare.com"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/admin/login/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: apihandler-tunnel
    command: tunnel --no-autoupdate --url http://web:8000
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped